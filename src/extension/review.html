<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SafePrompt review</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        padding: 18px 20px;
        display: grid;
        gap: 14px;
      }
      #app {
        display: grid;
        gap: 14px;
      }
      .dialog-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .dialog-head h1 {
        font-size: 18px;
      }
      .dialog-head p {
        margin: 2px 0 0;
      }
      footer {
        position: sticky;
        bottom: 0;
        background: var(--bg);
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
    </style>
  </head>
  <body role="dialog" aria-modal="true">
    <div id="app"><p class="muted">Checking…</p></div>
    <script src="review.js" type="module"></script>
  </body>
</html>
