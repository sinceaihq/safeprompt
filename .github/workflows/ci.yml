name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end (Chromium with the extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=low

  reproducible:
    name: reproducible package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node scripts/build.mjs --zip && cp dist/SHA256SUMS /tmp/first
      - run: rm -rf dist && node scripts/build.mjs --zip && diff /tmp/first dist/SHA256SUMS
      - name: Manifest permissions are the documented ones
        run: |
          node -e '
            const m = require("./dist/extension/manifest.json");
            const want = ["activeTab","scripting","sidePanel","storage"];
            const got = [...m.permissions].sort();
            if (JSON.stringify(got) !== JSON.stringify(want)) { console.error("permissions changed:", got); process.exit(1); }
            if (m.host_permissions) { console.error("unexpected host_permissions"); process.exit(1); }
          '
      - uses: actions/upload-artifact@v4
        with: { name: safeprompt-extension, path: "dist/safeprompt-*.zip", retention-days: 14 }
